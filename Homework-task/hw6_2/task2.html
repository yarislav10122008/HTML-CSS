<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="registration">
    <img src="inst.png" alt="instagram" class="inst">

    <form>
        <input type="text" placeholder="Номер телефону, ім'я користувача або email">
        <input type="password" placeholder="Пароль">
        <button type="submit">Увійти</button>
        <p class="or">АБО</p>
        <button type="button" class="facebook">
            <img src="facebook.png" alt="facebook" class="fb-icon">
            Увійти через Facebook
        </button>
        <p>Забули Пароль?</p>
    </form>
</div>

<div class="registration-footer">
    <p>Не має облікового запису? <button type="button" class="registration2">Зареєструйтеся</button></p>
</div>

</body>
</html>
