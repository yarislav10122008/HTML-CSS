<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .yes{
            appearance:none;
            width:20px;
            height:20px;
            border:1px solid #ff0000;
            margin-bottom: -2px;
            border-radius: 2px;

        }
        .yes:checked{
            background-color: #0b0606;
        }
    </style>
</head>
<body>
<label>
    <input type="checkbox" class="yes"> Yes
</label>

</body>
</html>
