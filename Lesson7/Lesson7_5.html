<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
           display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
            height: 100vh;
        }
        .card{
            width: 200px;
            height: 250px;
            background-color: #315887;
            position: relative;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;

        }
        .sale{
            width: 75px;
            height: 45px;
            background-color: #315887;
            position: absolute;
            top: -20px;
            border-radius: 20px 20px 0 0;
        }
        .sale-bottom{
            width: 75px;
            height: 45px;
            background-color: #315887;
            position: absolute;
            bottom: -20px;
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="sale"></div>
    <p>Lorem ipsum dolor.</p>
    <p>Nesciunt, numquam</p>
    <p>In, nostrum praesentium?</p>
    <div class="sale-bottom"> </div>
</div>


</body>
</html>
